name: Portal probe

# Manual check that every Povodí portal answers from GitHub's runners (tasks 2.1).
# Fetches robots.txt, the overview and the volumes page of each source: 15 requests in total.
# Commits nothing; the pages and the report are uploaded as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    # Forks must not contact the portals under this project's User-Agent.
    if: github.repository == 'jamescoq/waterlevels'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm probe probe-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe-out/
          retention-days: 30
