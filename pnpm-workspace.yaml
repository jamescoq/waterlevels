# Single-package project; this file only carries pnpm settings.

# Do not install package versions published less than 14 days ago (in minutes).
# Gives the registry time to pull compromised releases before they reach us.
minimumReleaseAge: 20160

# Install scripts: esbuild (used by tsx and Vite) checks its platform binary after install.
# better-sqlite3 and msgpackr-extract come with mapshaper; the map pipeline needs neither.
allowBuilds:
  better-sqlite3: false
  esbuild: true
  msgpackr-extract: false
